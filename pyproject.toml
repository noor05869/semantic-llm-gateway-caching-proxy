[project]
name = "semantic-llm-gateway"
version = "0.1.0"
description = "Production-grade Semantic Caching & Intelligent LLM Proxy Microservice"
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "fastembed>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

